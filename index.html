<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>মেসার্স জান্নাত সুজ - শোরুম ও স্টক ম্যানেজমেন্ট</title>
    <script>
      // Global error handler to catch issues before React mounts
      window.addEventListener('error', function(e) {
        document.body.innerHTML = '<div style="padding:20px;color:red;background:black;height:100vh;"><h3>Fatal Error:</h3><p>' + e.message + '</p><pre>' + (e.error ? e.error.stack : '') + '</pre><button onclick="localStorage.clear();window.location.reload();" style="padding:10px;">Clear Cache & Reload</button></div>';
      });
      
      // Force unregister all old service workers to fix blank page issues
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for(let registration of registrations) {
            registration.unregister();
            console.log('ServiceWorker unregistered');
          }
        });
      }
      // Clear all caches if requested
      if (window.location.search.includes('v=') || window.location.search.includes('refresh=')) {
        if ('caches' in window) {
          caches.keys().then((names) => {
            for (let name of names) caches.delete(name);
          });
        }
      }
    </script>
  </head>
  <body style="background-color: #020617; color: #f8fafc; margin: 0;">
    <!-- UI state reset -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
