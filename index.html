<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>মেসার্স জান্নাত সুজ - শোরুম ও স্টক ম্যানেজমেন্ট</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="জান্নাত সুজ" />
    <link rel="icon" type="image/svg+xml" href="/icon-512.svg" />
    <link rel="apple-touch-icon" href="/icon-512.svg" />
    <script>
      // Register service worker for PWA support
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            console.log('PWA ServiceWorker registered with scope:', reg.scope);
          }).catch((err) => {
            console.log('PWA ServiceWorker registration failed:', err);
          });
        });
      }
    </script>
  </head>
  <body style="background-color: #020617; color: #f8fafc; margin: 0;">
    <!-- UI state reset -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
