<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>মেসার্স জান্নাত সুজ - শোরুম ও স্টক ম্যানেজমেন্ট</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="জান্নাত সুজ" />
    <link rel="icon" type="image/svg+xml" href="/icon-512.svg" />
    <link rel="icon" type="image/svg+xml" sizes="192x192" href="/icon-192.svg" />
    <link rel="icon" type="image/svg+xml" sizes="512x512" href="/icon-512.svg" />
    <link rel="apple-touch-icon" href="/icon-512.svg" />
    <script>
      // Register service worker for PWA support only in production standalone mode
      if ('serviceWorker' in navigator) {
        if (window.location.hostname === 'localhost' || window.location.hostname.includes('run.app') || window.location.hostname.includes('dev')) {
          navigator.serviceWorker.getRegistrations().then((regs) => {
            regs.forEach((reg) => reg.unregister());
          });
          if (window.caches) {
            caches.keys().then((keys) => keys.forEach((key) => caches.delete(key)));
          }
        } else {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js').then((reg) => {
              console.log('PWA ServiceWorker registered with scope:', reg.scope);
            }).catch((err) => {
              console.log('PWA ServiceWorker registration failed:', err);
            });
          });
        }
      }
    </script>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('jannat_shoes_theme');
          var theme = (saved === 'light' || saved === 'dark') ? saved : 'dark';
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen m-0">
    <!-- UI state reset -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
