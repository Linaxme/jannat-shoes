<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient (Deep Navy Slate) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Luxury Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="20%" stop-color="#fbbf24"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Subtle Outer Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="70%" stop-color="#f59e0b" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow Filter for 3D Depth -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.75"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#f59e0b" flood-opacity="0.35"/>
    </filter>

    <!-- Clip Path for Inside the Emblem -->
    <clipPath id="emblemClip">
      <rect x="106" y="80" width="300" height="300" rx="64"/>
    </clipPath>
  </defs>

  <!-- Base App Background (100% full-bleed for maskable safe-zone) -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>
  <circle cx="256" cy="256" r="230" fill="url(#ambientGlow)"/>

  <!-- Subtle Outer Accent Ring (Inside maskable safe circle) -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.2" stroke-dasharray="4 6"/>

  <!-- Main Shop Logo Emblem (Amber-Gold Squircle) -->
  <g filter="url(#cardShadow)">
    <rect x="106" y="80" width="300" height="300" rx="64" fill="url(#goldGrad)"/>
    <!-- Glossy Bevel Highlight -->
    <rect x="108" y="82" width="296" height="296" rx="62" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.45"/>
    
    <!-- Top Sheen Curve -->
    <path d="M 106 144 C 180 180, 332 180, 406 144 L 406 120 C 406 97, 388 80, 365 80 L 147 80 C 124 80, 106 97, 106 120 Z" fill="#ffffff" fill-opacity="0.12"/>
  </g>

  <!-- Shop / Storefront Vector Art inside the Squircle -->
  <g id="shop-icon" transform="translate(146, 120)">
    <!-- Shop Awning Canopy (Roof) -->
    <path d="M 10 50 L 32 12 C 35 7, 40 4, 46 4 L 174 4 C 180 4, 185 7, 188 12 L 210 50 Z" fill="#090d16"/>
    <!-- Awning Scallops / Stripes -->
    <path d="M 10 50 L 32 12" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
    <path d="M 60 50 L 70 4" stroke="#f59e0b" stroke-width="4"/>
    <path d="M 110 50 L 110 4" stroke="#f59e0b" stroke-width="4"/>
    <path d="M 160 50 L 150 4" stroke="#f59e0b" stroke-width="4"/>
    <path d="M 210 50 L 188 12" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
    <!-- Awning Bottom Trim -->
    <rect x="8" y="50" width="204" height="8" rx="4" fill="#090d16"/>

    <!-- Shop Building Front Walls -->
    <rect x="22" y="58" width="176" height="136" rx="6" fill="#090d16"/>

    <!-- Signboard Header: JANNAT SHOES -->
    <rect x="36" y="66" width="148" height="24" rx="5" fill="#f59e0b"/>
    <text x="110" y="83" fill="#090d16" font-size="12" font-weight="900" font-family="'Segoe UI', Roboto, sans-serif" text-anchor="middle" letter-spacing="1.5">
      JANNAT SHOES
    </text>

    <!-- Left: Display Window with Golden Footwear Motif -->
    <rect x="36" y="98" width="68" height="84" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.6"/>
    <!-- Shoe Silhouette in Window -->
    <path d="M 46 156 C 54 148, 66 146, 76 146 C 84 146, 90 140, 94 130 L 98 132 C 100 136, 98 144, 92 152 C 86 160, 88 164, 96 166 L 46 166 C 42 166, 40 160, 46 156 Z" fill="#fbbf24"/>
    <rect x="44" y="166" width="54" height="4" rx="2" fill="#f59e0b"/>

    <!-- Right: Glass Showroom Door -->
    <rect x="116" y="98" width="68" height="96" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.8"/>
    <!-- Door Glass Dividers -->
    <line x1="116" y1="144" x2="184" y2="144" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.4"/>
    <!-- Golden Door Handle -->
    <rect x="122" y="136" width="4" height="18" rx="2" fill="#fbbf24"/>

    <!-- Shop Foundation Base Step -->
    <rect x="12" y="194" width="196" height="8" rx="4" fill="#d97706"/>
  </g>

  <!-- Bottom Shop Name Pill Banner (High Contrast & Legible) -->
  <g transform="translate(256, 432)">
    <!-- Pill Background -->
    <rect x="-144" y="-24" width="288" height="48" rx="24" fill="#0f172a" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.9"/>
    <!-- Inner Accent Glow -->
    <rect x="-140" y="-20" width="280" height="40" rx="20" fill="#1e293b" fill-opacity="0.4"/>
    
    <!-- Bengali Store Title: মেসার্স জান্নাত সুজ -->
    <text x="0" y="7" fill="#ffffff" font-size="20" font-weight="900" font-family="'Noto Sans Bengali', 'Kalpurush', 'SolaimanLipi', -apple-system, sans-serif" text-anchor="middle" letter-spacing="0.5">
      মেসার্স জান্নাত সুজ
    </text>
  </g>

  <!-- Bottom Wholesale Tag Subtext -->
  <text x="256" y="478" fill="#f59e0b" font-size="11" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle" letter-spacing="3">
    WHOLESALE SHOWROOM
  </text>
</svg>
